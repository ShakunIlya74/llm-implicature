# RSA Task 2 — probe wording (independent from Phase A betting prompts).
version: rsa_v1

n_items: 3
quantifier_surface_forms: ["none", "some", "all"]

# Assistant must continue so the next token is (ideally) None / Some / All.
speaker_probe:
  system: |
    You complete short scenarios with a single quantifier word only in the next token.
  user_template: |
    {setup}

    Facts for this hypothetical: exactly {state_s} of the 3 {items} have {property}.
    The speaker has looked at {k} of the 3 {items} (which {k} is random).

    The speaker will say on the phone exactly one quantifier about how many have {property}: None, Some, or All.

    Complete the speaker's line (next token only). No explanation.

    The speaker says: "
  # OpenAI-style messages append assistant content starting after the closing quote.

prior_probe:
  system: |
    You answer with a single quantifier word as the first token of your reply.
  user_template: |
    {setup}

    {prior_q}

    Before any phone call from {speaker}, respond with exactly one word as your first token — None, Some, or All — summarizing your prior expectation about how many of the 3 {items} have {property}.

    Your one-word answer:
  # Next token should be None/Some/All (coarse prior surrogate; see README).

# Same as phase_a_smoke but live inference (no dry_run). Use for API verification.
experiment_name: rsa_implicature_phase_a_smoke_live
prompt_version: phase_a_v1
seed: 42

prompt_contract_path: code/pipeline_v1/prompts/phase_a_prompt_contract_gs2013_wording.yaml

phase_a:
  note: "Live smoke: 1 stimulus row × 1 model before full grid."

design:
  total_items: 3
  story_indices: [1]
  knowledge_levels: [2]
  utterances: ["some"]
  prompt_strategies: ["baseline"]
  paraphrases_per_condition: 1
  samples_per_prompt: 3
  question_types: [posterior]

generation:
  include_number_words: false
  number_words: ["one", "two", "three"]
  output_path: code/pipeline_v1/data/processed/stimuli.phase_a_smoke.jsonl

run:
  dry_run: false
  max_examples: 1
  concurrency: 15
  temperature: 0.2
  max_tokens: 256

output:
  run_root: code/pipeline_v1/results/runs

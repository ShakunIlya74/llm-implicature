    provider: openrouter
    scale_tier: frontier
    reasoning_mode: non_reasoning
  - id: deepseek/deepseek-r1-0528
    provider: openrouter
    scale_tier: frontier
    reasoning_mode: reasoning
  - id: qwen/qwen-2.5-7b-instruct
    provider: openrouter
    scale_tier: small
    reasoning_mode: non_reasoning
  - id: qwen/qwen-2.5-14b-instruct
    provider: openrouter
    scale_tier: medium
    reasoning_mode: non_reasoning
  - id: qwen/qwen-2.5-32b-instruct
    provider: openrouter
    scale_tier: medium
    reasoning_mode: non_reasoning
  - id: qwen/qwen3-32b
    provider: openrouter
    scale_tier: medium
    reasoning_mode: non_reasoning
  - id: qwen/qwen3-235b-a22b
    provider: openrouter
    scale_tier: frontier
